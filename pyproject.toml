[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "oaax-manager"
version = "0.1.0"
description = "List and fetch OAAX runtimes and toolchains"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
oaax-manager = "oaax_manager.cli:main"

[tool.setuptools.package-data]
oaax_manager = ["index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
