[build-system]
requires = ["setuptools==80.9.0"]  # exact: the wheel bytes depend on the backend version (reproducible builds)
build-backend = "setuptools.build_meta"

[project]
name = "oaax-manager"
dynamic = ["version"]
description = "List and fetch OAAX runtimes and toolchains"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[dependency-groups]
dev = ["pytest", "pyyaml"]

[project.scripts]
oaax-manager = "oaax_manager.cli:main"

[tool.setuptools.package-data]
oaax_manager = ["index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "oaax_manager.__version__" }
