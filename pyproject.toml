[build-system]
requires = ["setuptools==80.9.0"]  # exact: the wheel bytes depend on the backend version (reproducible builds)
build-backend = "setuptools.build_meta"

[project]
name = "oaax-manager"
dynamic = ["version"]
description = "List and fetch OAAX runtimes and toolchains"
readme = "README.pypi.md"  # the PyPI page; the GitHub README is longer
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["oaax", "ai", "accelerator", "runtime", "toolchain", "onnx"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/OAAX-standard/oaax-manager"
Documentation = "https://docs.oaax.org"
Issues = "https://github.com/OAAX-standard/oaax-manager/issues"
Changelog = "https://github.com/OAAX-standard/oaax-manager/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest", "pyyaml"]

[project.scripts]
oaax-manager = "oaax_manager.cli:main"

[tool.setuptools.package-data]
oaax_manager = ["index.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "oaax_manager.__version__" }
