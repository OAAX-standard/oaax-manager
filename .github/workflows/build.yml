name: build
# Builds the wheel and the single-file .pyz, checks them, and keeps them as workflow artifacts.
# A tag vX.Y.Z also creates a DRAFT GitHub Release (a maintainer reviews it and presses Publish; that triggers publish.yml, the only workflow that talks to PyPI).
# "Run workflow" (workflow_dispatch) on any branch is the dry run: everything except the release job.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # On a tag the tests (Linux/Windows/macOS, Python 3.9/3.13) must pass too before a release is drafted.
  # On branches and pull requests tests.yml runs by itself.
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the tag check below needs main's history
      - name: The tagged commit must be on main (tests and review happened there)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main, tag a commit of main"; exit 1; }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          version: "0.10.9"  # pinned: part of the reproducible build
      - name: Build wheel and pyz (reproducible, timestamps fixed to the commit time)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          uv build --wheel --out-dir dist
          uv run --no-project python tools/build_pyz.py dist/oaax-manager.pyz
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: The build is reproducible (a second build from the same commit gives identical bytes)
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          uv build --wheel --out-dir dist2
          uv run --no-project python tools/build_pyz.py dist2/oaax-manager.pyz
          (cd dist2 && sha256sum -c ../dist/SHA256SUMS)
      - name: Release notes (dry run on every build; fails if CHANGELOG.md lacks this version, on a tag also if it is still "unreleased")
        shell: bash
        run: |
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = .(.+?).$', pathlib.Path('src/oaax_manager/__init__.py').read_text(), re.M)[1])")
          final=; if [ "$GITHUB_REF_TYPE" = tag ]; then final=--final; fi
          uv run --no-project python tools/release_notes.py "$version" dist/SHA256SUMS $final > release-notes.md
          test -s release-notes.md
          cat release-notes.md
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv run --no-project python -c "import re,pathlib;print(re.search(r'__version__ = .(.+?).$', pathlib.Path('src/oaax_manager/__init__.py').read_text(), re.M)[1])")
          test "${GITHUB_REF_NAME}" = "v$version" || { echo "tag $GITHUB_REF_NAME != version $version"; exit 1; }
      - name: Smoke test the wheel in a clean venv (index.json inside, exit codes work)
        shell: bash
        run: tools/smoke.sh uvx --isolated --from "$(ls dist/*.whl)" oaax-manager
      - name: Smoke test the pyz
        shell: bash
        run: tools/smoke.sh uv run --no-project python dist/oaax-manager.pyz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oaax-manager-${{ github.sha }}
          path: dist/*
          retention-days: 30
          overwrite: true   # a re-run of all jobs must not fail on the artifact of the first run
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-notes
          path: release-notes.md
          overwrite: true
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oaax-manager-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the DRAFT GitHub Release (publish it by hand after checking the assets)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # "Re-run failed jobs" after a draft exists would create a second draft for the same tag (drafts are not found by `gh release view TAG`)
          if gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[].tagName' | grep -qx "$GITHUB_REF_NAME"; then
            echo "a release (draft or published) for $GITHUB_REF_NAME already exists: edit or delete it, then re-run"; exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file release-notes.md
