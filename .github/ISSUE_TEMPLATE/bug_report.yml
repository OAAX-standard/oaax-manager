name: Bug report
description: "`oaax-manager list` or `fetch` does something wrong, or an error message does not help."
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a bug in a runtime or toolchain itself, open the issue in that component's repository instead (see the [repository map](https://github.com/OAAX-standard/OAAX/blob/main/CONTRIBUTING.md#contributing-to-oaax-implementations)).
  - type: textarea
    id: what
    attributes:
      label: What did you run, what happened, and what did you expect?
      description: The exact command and its output.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `oaax-manager --version`
      placeholder: "oaax-manager 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, CPU architecture and Python version
      placeholder: "Ubuntu 22.04, x86_64, Python 3.12 (or the .pyz)"
